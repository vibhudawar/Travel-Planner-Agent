name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      # Dummy secrets so get_settings() validates; the suites below are network-free.
      OPENAI_API_KEY: test-key
      SERPAPI_API_KEY: test-key
      OPENWEATHER_API_KEY: test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cache-correctness tests
        run: python evals/test_cache.py
      - name: Deterministic metric tests
        run: python evals/test_metrics.py
      - name: Tool-hardening tests
        run: python evals/test_tools_hardening.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
